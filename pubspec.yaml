name: cybershield_forum
description: CyberShield Forum - A community-driven cybersecurity awareness platform.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.2
  webview_flutter: 4.4.0
  google_generative_ai: ^0.4.7
  flutter_sms_inbox: ^1.0.4
  permission_handler: ^12.0.1
  freerasp: ^6.1.1
  file_picker: ^8.0.0
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  archive: ^3.6.1
  installed_apps: ^1.4.3
  flutter_local_notifications: ^22.0.0
  audioplayers: ^6.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/matcher-game/
    - assets/matcher-game/images/
    - assets/drone-game/
    - assets/shieldmaze/
    - assets/shieldmaze/assets/

dependency_overrides:
  url_launcher_android: 6.3.10

