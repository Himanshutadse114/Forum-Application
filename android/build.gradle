allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}
subprojects {
    project.plugins.withId("com.android.library") {
        if (project.name == "jitsi_meet_flutter_sdk") {
            project.android {
                namespace "org.jitsi.jitsi_meet_flutter_sdk"
            }
            def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                manifestFile.text = manifestFile.text.replaceAll(/package="[^"]*"/, "")
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
